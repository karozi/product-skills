name: Validate skills

on:
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - ".github/workflows/validate-skills.yml"
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/validate-skills.yml"
  workflow_dispatch:

concurrency:
  group: validate-skills-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      - name: Test validator
        run: python3 -m unittest discover -s skills/documentation/skill-improver/tests -p "test_*.py"
      - name: Validate all skills
        run: python3 skills/documentation/skill-improver/scripts/validate_skills.py --repo-root .
