name: Sync skills README

on:
  push:
    branches:
      - main
    paths:
      - "skills/**/SKILL.md"
      - "skills/**/agents/openai.yaml"
      - "skills/documentation/auto-gist-publisher/state/published.json"
      - "skills/documentation/sync-skills-readme/scripts/**"
      - "skills/documentation/sync-skills-readme/tests/**"
      - ".github/workflows/sync-skills-readme.yml"
  workflow_dispatch:

concurrency:
  group: sync-skills-readme-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      - name: Test generator
        run: python3 -m unittest discover -s skills/documentation/sync-skills-readme/tests -p "test_*.py"
      - name: Update catalog
        run: python3 skills/documentation/sync-skills-readme/scripts/sync_skills_readme.py --repo-root . --write
      - name: Commit README when changed
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already current."
            exit 0
          fi
          # Pick up any concurrent bot commits (e.g. gist state) before writing.
          git pull --rebase --autostash origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync skills catalog"
          git push
