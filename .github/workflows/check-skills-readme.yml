name: Check skills README

on:
  pull_request:
    paths:
      - "README.md"
      - "skills/**/SKILL.md"
      - "skills/**/agents/openai.yaml"
      - "skills/documentation/sync-skills-readme/scripts/**"
      - "skills/documentation/sync-skills-readme/tests/**"
      - ".github/workflows/check-skills-readme.yml"
      - ".github/workflows/sync-skills-readme.yml"

concurrency:
  group: check-skills-readme-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      - name: Test generator
        run: python3 -m unittest discover -s skills/documentation/sync-skills-readme/tests -p "test_*.py"
      - name: Verify catalog is current
        run: python3 skills/documentation/sync-skills-readme/scripts/sync_skills_readme.py --repo-root . --check
